# Runs only when started by hand (workflow_dispatch).
#
# Plays one table of CPU-against-CPU matches split into shards, one shard per job, then joins the shards and reports.
# Every shard must run in the same environment (node version, game commit, CPU versions): merge refuses otherwise.
# The actions run on node 24 (checkout v7, setup-node v7, upload-artifact v7, download-artifact v8). The runner image is pinned (ubuntu-24.04) and its
# version is written into env.json (info, not part of the key); the node version is pinned exactly (NODE_VERSION).
name: bench

on:
  workflow_dispatch:
    inputs:
      game_commit:
        description: 'Siege_Zeke_openbeta commit to test (full sha)'
        required: true
      cpu_a:
        description: 'CPU A (name or path, optional ?key=value&...)'
        default: simple
      cpu_b:
        description: 'CPU B'
        default: simple
      seeds:
        description: 'seeds: a count (1..N) or a comma list'
        default: '40'
      shards:
        description: 'number of shards (must match the matrix below)'
        default: '4'
      swap:
        description: 'also play with the CPUs on the other seats (true/false)'
        default: 'false'

env:
  NODE_VERSION: '24.19.0'   # exact: part of the environment key

jobs:
  shard:
    runs-on: ubuntu-24.04           # 4 vCPU, 16 GB on public repositories. Pinned, not ubuntu-latest: the image a result was made on should not change under it
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]         # keep in sync with the `shards` input
    steps:
      - uses: actions/checkout@v7   # this repository
      - uses: actions/checkout@v7   # the game, at the commit to test
        with:
          repository: kujaku102-sketch/Siege_Zeke_openbeta
          ref: ${{ inputs.game_commit }}
          path: game
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Inputs reach the shell only as environment variables (never `${{ ... }}` inside a run: script), so a value cannot be run as a command.
      - name: Play the shard
        env:
          GAME_DIR: ${{ github.workspace }}/game
          GAME_COMMIT: ${{ inputs.game_commit }}
          CPU_A: ${{ inputs.cpu_a }}
          CPU_B: ${{ inputs.cpu_b }}
          SEEDS: ${{ inputs.seeds }}
          SHARDS: ${{ inputs.shards }}
          SHARD: ${{ matrix.shard }}
          SWAP: ${{ inputs.swap }}
        run: |
          [[ "$GAME_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "game_commit must be a full sha"; exit 1; }
          [[ "$SEEDS" =~ ^[0-9]+(,[0-9]+)*$ ]] || { echo "seeds: a count or a comma list of numbers"; exit 1; }
          [[ "$SHARDS" =~ ^[0-9]+$ && "$SHARD" =~ ^[0-9]+$ ]] || { echo "shards must be numbers"; exit 1; }
          extra=()
          if [ "$SWAP" = "true" ]; then extra+=(--swap); fi
          node src/run.mjs --a "$CPU_A" --b "$CPU_B" --seeds "$SEEDS" "${extra[@]}" \
            --shard "$SHARD/$SHARDS" --workers 3 --max-matches 2000 --out "out/shard-$SHARD-of-$SHARDS"
      - uses: actions/upload-artifact@v7
        if: always()                # a stopped shard keeps what it finished; run it again to continue
        with:
          name: shard-${{ matrix.shard }}
          path: out/
          retention-days: 14

  merge:
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          path: parts/
      - name: Join and report
        run: |
          node src/merge.mjs --out merged parts/shard-*/shard-*
          node src/report.mjs merged
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: merged
          path: merged/
          retention-days: 30
